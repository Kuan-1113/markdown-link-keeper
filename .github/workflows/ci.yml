name: 測試與相容性檢查

# 什麼時候跑：
#   1. 每次推程式碼 —— 確認沒改壞東西
#   2. 每週一早上 —— 檢查有沒有被新版 IDE 弄壞
#
# 注意：排程指的是「電腦多久檢查一次」，不是你多久要做一次事。
# 沒壞的時候完全不會通知；只有失敗才會寄信給你。
#
# 想改成每月檢查，把下面 cron 那行換成：'0 1 1 * *'（每月 1 號）

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: '0 1 * * 1'   # 每週一 01:00 UTC（台灣時間週一早上 9 點）
  workflow_dispatch:       # 也可以在 GitHub 網頁上手動按一下就跑

jobs:
  test:
    name: 單元測試與整合測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 跑測試
        run: ./gradlew test --no-daemon

      - name: 保留測試報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 測試報告
          path: build/reports/tests/test/

  verify:
    name: IDE 相容性檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v4

      # 這一步就是防止「插件被新版 IDE 弄壞卻沒人發現」的守門員
      - name: 對多個 IDE 版本驗證相容性
        run: ./gradlew verifyPlugin --no-daemon

      - name: 保留檢查報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 相容性報告
          path: build/reports/pluginVerifier/
